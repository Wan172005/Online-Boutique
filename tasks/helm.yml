---
- name: Validate Helm 3 version and supported CPU architecture
  ansible.builtin.assert:
    that:
      - helm_version is match('^v3\.[0-9]+\.[0-9]+$')
      - ansible_facts.architecture in ['x86_64', 'aarch64']
    fail_msg: Use a Helm 3 version (v3.x.y) on an amd64 or arm64 control plane.

- name: Create Helm download directory
  ansible.builtin.file:
    path: "{{ helm_download_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download the pinned Helm 3 archive and verify its SHA256 checksum
  ansible.builtin.get_url:
    url: "{{ helm_archive_url }}"
    dest: "{{ helm_download_path }}/helm.tar.gz"
    checksum: "sha256:{{ helm_archive_url }}.sha256sum"
    mode: '0644'

- name: Extract the Helm 3 binary
  ansible.builtin.unarchive:
    src: "{{ helm_download_path }}/helm.tar.gz"
    dest: "{{ helm_download_path }}"
    remote_src: true
    creates: "{{ helm_download_path }}/linux-{{ helm_arch }}/helm"

- name: Install Helm 3 in the executable search path
  ansible.builtin.copy:
    src: "{{ helm_download_path }}/linux-{{ helm_arch }}/helm"
    dest: /usr/local/bin/helm
    remote_src: true
    owner: root
    group: root
    mode: '0755'

- name: Read the installed Helm version
  ansible.builtin.command:
    argv: [/usr/local/bin/helm, version, --short]
  register: helm_installed_version
  changed_when: false

- name: Verify the pinned Helm 3 version is installed
  ansible.builtin.assert:
    that:
      - helm_installed_version.stdout.split('+')[0] == helm_version
    success_msg: "Helm {{ helm_installed_version.stdout }} is installed on {{ inventory_hostname }}."
