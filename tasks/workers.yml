---
- name: Check whether the worker has already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: worker_kubelet_config

- name: Wait for the control plane API on the private network
  ansible.builtin.wait_for:
    host: "{{ kubernetes_control_plane_ip }}"
    port: 6443
    timeout: 60
  when: not worker_kubelet_config.stat.exists

- name: Create a bootstrap token only for a worker that has not joined
  ansible.builtin.command:
    argv: [kubeadm, token, create, --print-join-command]
  delegate_to: "{{ kubernetes_control_plane_host }}"
  register: worker_join_command
  when: not worker_kubelet_config.stat.exists
  no_log: true

- name: Stop kubelet to release its port immediately before joining
  ansible.builtin.systemd_service:
    name: kubelet
    state: stopped
  when: not worker_kubelet_config.stat.exists

- name: Join the worker only when its kubelet configuration is absent
  ansible.builtin.command:
    argv: >-
      {{ worker_join_command.stdout.split()
         + kubernetes_join_command_extra_opts.split()
         + ['--node-name', inventory_hostname] }}
    creates: /etc/kubernetes/kubelet.conf
  when: not worker_kubelet_config.stat.exists
  no_log: true
