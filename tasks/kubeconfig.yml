---
- name: Restrict access to the control plane admin kubeconfig
  ansible.builtin.file:
    path: /etc/kubernetes/admin.conf
    owner: root
    group: root
    mode: '0600'

- name: Look up the SSH user's home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Restrict kubeconfig directories to their owners
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    mode: '0700'
  loop:
    - {path: /root/.kube, owner: root}
    - path: "{{ ansible_facts.getent_passwd[ansible_user][4] }}/.kube"
      owner: "{{ ansible_user }}"

- name: Link root's kubeconfig to the protected admin kubeconfig
  ansible.builtin.file:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    state: link
    owner: root
    group: root
    follow: false
    force: true

- name: Install admin kubeconfig for the SSH user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ ansible_facts.getent_passwd[ansible_user][4] }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  when: ansible_user != 'root'
