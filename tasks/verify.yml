---
- name: Wait for each inventory node to register with the API
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - node
      - "{{ item }}"
  loop: "{{ groups['k8s'] }}"
  register: node_registration
  until: node_registration.rc == 0
  retries: 12
  delay: 5
  changed_when: false

- name: Wait for each inventory node to become Ready
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - wait
      - --for=condition=Ready
      - "node/{{ item }}"
      - "--timeout={{ kubernetes_ready_timeout }}"
  loop: "{{ groups['k8s'] }}"
  changed_when: false

- name: Wait for Flannel rollout across both nodes
  ansible.builtin.command: >-
    kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-flannel
    rollout status daemonset/kube-flannel-ds --timeout={{ kubernetes_ready_timeout }}
  changed_when: false

- name: Wait for cluster DNS
  ansible.builtin.command: >-
    kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system
    rollout status deployment/coredns --timeout={{ kubernetes_ready_timeout }}
  changed_when: false

- name: Wait for every kube-system Pod to become Ready
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - --namespace=kube-system
      - wait
      - --for=condition=Ready
      - pods
      - --all
      - "--timeout={{ kubernetes_ready_timeout }}"
  changed_when: false

- name: Create a private local directory for kubeconfig
  ansible.builtin.file:
    path: "{{ kubernetes_kubeconfig_local_path | dirname }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false

- name: Export admin kubeconfig to the Ansible controller
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubernetes_kubeconfig_local_path }}"
    flat: true
  no_log: true

- name: Set the local kubeconfig API endpoint
  ansible.builtin.lineinfile:
    path: "{{ kubernetes_kubeconfig_local_path }}"
    regexp: '^\s+server:'
    line: '    server: {{ kubernetes_kubeconfig_server }}'
    mode: '0600'
  delegate_to: localhost
  become: false
  no_log: true

- name: Show cluster nodes and private addresses
  ansible.builtin.command: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes -o wide
  register: cluster_nodes
  changed_when: false

- name: Report cluster status and local kubeconfig path
  ansible.builtin.debug:
    msg:
      - "{{ cluster_nodes.stdout_lines }}"
      - "Kubeconfig: {{ kubernetes_kubeconfig_local_path }}"
      - "Local API endpoint: {{ kubernetes_kubeconfig_server }} (a loopback endpoint requires an SSH tunnel; VM checks can run directly on the control plane)"
