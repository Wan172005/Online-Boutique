---
- hosts: k8s_control_plane
  become: yes

  vars:
    helm_version: v3.21.4
    helm_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"
    helm_download_path: "/tmp/helm-{{ helm_version }}-{{ helm_arch }}"

  pre_tasks:
    - name: Prepare Python Kubernetes client
      ansible.builtin.import_tasks: tasks/client.yml

  tasks:
    - name: Create Helm download directory.
      ansible.builtin.file:
        path: "{{ helm_download_path }}"
        state: directory
        mode: '0755'

    - name: Retrieve helm binary archive.
      unarchive:
        src: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
        dest: "{{ helm_download_path }}"
        creates: "{{ helm_download_path }}/linux-{{ helm_arch }}/helm"
        remote_src: yes

    - name: Move helm binary into place.
      ansible.builtin.copy:
        src: "{{ helm_download_path }}/linux-{{ helm_arch }}/helm"
        dest: /usr/local/bin/helm
        remote_src: true
        mode: '0755'

    - name: Add Bitnami's chart repository.
      kubernetes.core.helm_repository:
        name: bitnami
        repo_url: "https://charts.bitnami.com/bitnami"

    - name: Install phpMyAdmin with Helm.
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: phpmyadmin
        chart_ref: bitnami/phpmyadmin
        release_namespace: default
        values:
          service:
            type: NodePort

    - name: Get the details of the phpmyadmin Service.
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: v1
        kind: Service
        name: phpmyadmin
        namespace: default
      register: phpmyadmin_service

    - name: Print the NodePort of the phpmyadmin Service.
      debug:
        var: phpmyadmin_service.resources[0].spec.ports[0].nodePort
