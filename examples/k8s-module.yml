---
- hosts: k8s_control_plane
  become: yes

  pre_tasks:
    - name: Prepare Python Kubernetes client
      ansible.builtin.import_tasks: tasks/client.yml

  tasks:
    - name: Apply Nginx definition from Ansible controller file system.
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition: "{{ lookup('file', 'files/nginx.yml') | from_yaml }}"

    - name: Expose the Nginx service with an inline Service definition.
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            labels:
              app: nginx
            name: a4d-nginx
            namespace: default
          spec:
            type: NodePort
            ports:
            - port: 80
              nodePort: 30080
              protocol: TCP
              targetPort: 80
            selector:
              app: nginx

    - name: Get the details of the a4d-nginx Service.
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: v1
        kind: Service
        name: a4d-nginx
        namespace: default
      register: a4d_nginx_service

    - name: Print the NodePort of the a4d-nginx Service.
      debug:
        var: a4d_nginx_service.resources[0].spec.ports[0].nodePort
